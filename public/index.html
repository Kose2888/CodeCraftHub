<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraftHub - Learning Management Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #8B5CF6;
      --primary-dark: #7C3AED;
      --primary-light: #A78BFA;
      --success: #F59E0B;
      --success-dark: #D97706;
      --danger: #EF4444;
      --danger-dark: #DC2626;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-light: #6B7280;
      --border: #E5E7EB;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.9;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      color: var(--text);
      font-size: 1.25rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: white;
      color: var(--text);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 42px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .form-group input.error,
    .form-group textarea.error,
    .form-group select.error {
      border-color: var(--danger);
    }

    .error-text {
      color: var(--danger);
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: var(--success-dark);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #D1D5DB;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #F59E0B;
    }

    .message.error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid var(--danger);
    }

    .courses-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .courses-count {
      color: var(--text-light);
      font-size: 0.9rem;
    }

    .course-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .course-card.status-not-started {
      border-left-color: var(--text-light);
    }

    .course-card.status-in-progress {
      border-left-color: var(--success);
    }

    .course-card.status-completed {
      border-left-color: var(--primary);
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .course-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .course-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .course-description {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .course-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-label {
      color: var(--text-light);
      font-weight: 500;
    }

    .meta-value {
      color: var(--text);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .status-badge.not-started {
      background: #F3F4F6;
      color: #6B7280;
    }

    .status-badge.in-progress {
      background: #FEF3C7;
      color: #D97706;
    }

    .status-badge.completed {
      background: #EDE9FE;
      color: #7C3AED;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .loading-container .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      color: var(--text);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-light);
      padding: 4px;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 24px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.4rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .course-header {
        flex-direction: column;
      }

      .course-actions {
        width: 100%;
      }

      .course-actions .btn {
        flex: 1;
      }

      .course-meta {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeCraftHub</h1>
    <p>Your Learning Management Platform</p>
  </header>

  <main class="container">
    <div id="message" class="message"></div>

    <!-- Add Course Form -->
    <div class="card">
      <h2>Add New Course</h2>
      <form id="addCourseForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Course Name *</label>
            <input type="text" id="name" name="name" placeholder="e.g., React Fundamentals" required>
          </div>
          <div class="form-group">
            <label for="targetCompletionDate">Target Completion Date *</label>
            <input type="date" id="targetCompletionDate" name="targetCompletionDate" required>
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" required>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-top: 16px;">
          <label for="description">Description *</label>
          <textarea id="description" name="description" placeholder="Describe what you'll learn in this course..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span class="btn-text">Add Course</span>
            <span class="spinner" style="display: none;"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- Courses List -->
    <div class="card">
      <div class="courses-header">
        <h2>Your Courses</h2>
        <span class="courses-count" id="coursesCount"></span>
      </div>
      <div id="coursesList">
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Course</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="editCourseForm">
          <input type="hidden" id="editId">
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="editName">Course Name *</label>
            <input type="text" id="editName" name="name" required>
          </div>
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="editDescription">Description *</label>
            <textarea id="editDescription" name="description" required></textarea>
          </div>
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="editTargetCompletionDate">Target Completion Date *</label>
            <input type="date" id="editTargetCompletionDate" name="targetCompletionDate" required>
          </div>
          <div class="form-group">
            <label for="editStatus">Status *</label>
            <select id="editStatus" name="status" required>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
        <button type="button" class="btn btn-success" id="saveEdit">
          <span class="btn-text">Save Changes</span>
          <span class="spinner" style="display: none;"></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/courses';
    let courses = [];

    // DOM Elements
    const addForm = document.getElementById('addCourseForm');
    const coursesList = document.getElementById('coursesList');
    const coursesCount = document.getElementById('coursesCount');
    const messageEl = document.getElementById('message');
    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editCourseForm');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      fetchCourses();
      setupEventListeners();
    });

    function setupEventListeners() {
      addForm.addEventListener('submit', handleAddCourse);
      document.getElementById('closeModal').addEventListener('click', closeEditModal);
      document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
      document.getElementById('saveEdit').addEventListener('click', handleSaveEdit);
      editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
      });
    }

    // API Functions
    async function fetchCourses() {
      showLoading();
      try {
        const response = await fetch(API_BASE);
        if (!response.ok) throw new Error('Failed to fetch courses');
        courses = await response.json();
        renderCourses();
      } catch (error) {
        showError('Failed to load courses. Please check if the server is running.');
        coursesList.innerHTML = '';
      }
    }

    async function createCourse(courseData) {
      const response = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(courseData)
      });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Failed to create course');
      }
      return response.json();
    }

    async function updateCourse(id, courseData) {
      const response = await fetch(`${API_BASE}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(courseData)
      });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Failed to update course');
      }
      return response.json();
    }

    async function deleteCourse(id) {
      const response = await fetch(`${API_BASE}/${id}`, {
        method: 'DELETE'
      });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Failed to delete course');
      }
      return response.status === 204;
    }

    // Event Handlers
    async function handleAddCourse(e) {
      e.preventDefault();

      const formData = new FormData(addForm);
      const courseData = {
        name: formData.get('name').trim(),
        description: formData.get('description').trim(),
        targetCompletionDate: formData.get('targetCompletionDate'),
        status: formData.get('status')
      };

      if (!validateForm(courseData)) return;

      const submitBtn = document.getElementById('submitBtn');
      setButtonLoading(submitBtn, true);

      try {
        await createCourse(courseData);
        showSuccess('Course added successfully!');
        addForm.reset();
        fetchCourses();
      } catch (error) {
        showError(error.message);
      } finally {
        setButtonLoading(submitBtn, false);
      }
    }

    async function handleSaveEdit() {
      const id = document.getElementById('editId').value;
      const courseData = {
        name: document.getElementById('editName').value.trim(),
        description: document.getElementById('editDescription').value.trim(),
        targetCompletionDate: document.getElementById('editTargetCompletionDate').value,
        status: document.getElementById('editStatus').value
      };

      if (!validateForm(courseData)) return;

      const saveBtn = document.getElementById('saveEdit');
      setButtonLoading(saveBtn, true);

      try {
        await updateCourse(id, courseData);
        showSuccess('Course updated successfully!');
        closeEditModal();
        fetchCourses();
      } catch (error) {
        showError(error.message);
      } finally {
        setButtonLoading(saveBtn, false);
      }
    }

    async function handleDeleteCourse(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

      try {
        await deleteCourse(id);
        showSuccess('Course deleted successfully!');
        fetchCourses();
      } catch (error) {
        showError(error.message);
      }
    }

    // UI Functions
    function showLoading() {
      coursesList.innerHTML = `
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>
      `;
    }

    function renderCourses() {
      if (courses.length === 0) {
        coursesList.innerHTML = `
          <div class="empty-state">
            <h3>No courses yet</h3>
            <p>Add your first course to start tracking your learning journey!</p>
          </div>
        `;
        coursesCount.textContent = '0 courses';
        return;
      }

      coursesCount.textContent = `${courses.length} course${courses.length !== 1 ? 's' : ''}`;
      coursesList.innerHTML = courses.map(course => createCourseCard(course)).join('');
    }

    function createCourseCard(course) {
      const statusClass = course.status.toLowerCase().replace(' ', '-');
      const formattedDate = formatDate(course.createdAt);
      const statusBadgeClass = course.status.toLowerCase().replace(' ', '-');

      return `
        <div class="course-card status-${statusClass}" data-id="${course.id}">
          <div class="course-header">
            <h3 class="course-title">${escapeHtml(course.name)}</h3>
            <div class="course-actions">
              <button class="btn btn-primary btn-sm" onclick="openEditModal('${course.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="handleDeleteCourse('${course.id}', '${escapeHtml(course.name)}')">Remove</button>
            </div>
          </div>
          <p class="course-description">${escapeHtml(course.description)}</p>
          <div class="course-meta">
            <div class="meta-item">
              <span class="meta-label">Status:</span>
              <span class="status-badge ${statusBadgeClass}">${course.status}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Target:</span>
              <span class="meta-value">${course.targetCompletionDate}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Created:</span>
              <span class="meta-value">${formattedDate}</span>
            </div>
          </div>
        </div>
      `;
    }

    function openEditModal(id) {
      const course = courses.find(c => c.id === id);
      if (!course) return;

      document.getElementById('editId').value = course.id;
      document.getElementById('editName').value = course.name;
      document.getElementById('editDescription').value = course.description;
      document.getElementById('editTargetCompletionDate').value = course.targetCompletionDate;
      document.getElementById('editStatus').value = course.status;

      editModal.classList.add('show');
    }

    function closeEditModal() {
      editModal.classList.remove('show');
    }

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
      setTimeout(() => {
        messageEl.classList.remove('show');
      }, 5000);
    }

    function showSuccess(text) {
      showMessage(text, 'success');
    }

    function showError(text) {
      showMessage(text, 'error');
    }

    function setButtonLoading(btn, loading) {
      const btnText = btn.querySelector('.btn-text');
      const spinner = btn.querySelector('.spinner');

      if (loading) {
        btnText.style.display = 'none';
        spinner.style.display = 'inline-block';
        btn.disabled = true;
      } else {
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        btn.disabled = false;
      }
    }

    function validateForm(data) {
      if (!data.name || data.name.trim() === '') {
        showError('Course name is required');
        return false;
      }
      if (!data.description) {
        showError('Description is required');
        return false;
      }
      if (!data.targetCompletionDate) {
        showError('Target completion date is required');
        return false;
      }
      if (!['Not Started', 'In Progress', 'Completed'].includes(data.status)) {
        showError('Invalid status selected');
        return false;
      }
      return true;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
